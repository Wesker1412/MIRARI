name: MIRARI Technical Verification & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: Validate Schema, Integrity & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Article Schemas & Slug Uniqueness
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const articlesDir = 'content/articles';
            const files = fs.readdirSync(articlesDir).filter(f => f.endsWith('.mdx') || f.endsWith('.md'));
            const ids = new Set();
            const slugs = new Set();

            console.log('Validating', files.length, 'article documents...');
            for (const file of files) {
              const content = fs.readFileSync(path.join(articlesDir, file), 'utf8');
              const idMatch = content.match(/id:\s*[\"']([^\"']+)[\"']/);
              const slugMatch = content.match(/slug:\s*[\"']([^\"']+)[\"']/);
              const titleMatch = content.match(/title:\s*[\"']([^\"']+)[\"']/);
              const refMatch = content.includes('references:');

              if (!idMatch || !slugMatch || !titleMatch) {
                throw new Error('Article ' + file + ' missing mandatory frontmatter (id, slug, or title)');
              }
              const id = idMatch[1];
              const slug = slugMatch[1];

              if (ids.has(id)) {
                throw new Error('Duplicate article ID detected: ' + id + ' in ' + file);
              }
              if (slugs.has(slug)) {
                throw new Error('Duplicate article slug detected: ' + slug + ' in ' + file);
              }
              ids.add(id);
              slugs.add(slug);

              if (!refMatch) {
                throw new Error('Article ' + file + ' missing mandatory references citation list');
              }
            }
            console.log('✓ All', files.length, 'articles have unique IDs, stable slugs, and valid citation lists.');
          "

      - name: Build Knowledge Index, TypeScript & Static Prerender
        run: npm run build

      - name: Verify Indexing & Manifest Integrity
        run: |
          node -e "
            const fs = require('fs');
            const articles = JSON.parse(fs.readFileSync('src/data/generated/articles-manifest.json', 'utf8'));
            const evidence = JSON.parse(fs.readFileSync('src/data/generated/evidence-index.json', 'utf8'));
            const search = JSON.parse(fs.readFileSync('src/data/generated/search-index.json', 'utf8'));

            console.log('✓ Total compiled articles:', articles.length);
            console.log('✓ Total evidence indexed articles:', Object.keys(evidence).length);
            console.log('✓ Search index entries:', search.length);

            if (articles.length === 0) {
              throw new Error('Build error: articles-manifest.json is empty');
            }
            if (Object.keys(evidence).length === 0) {
              throw new Error('Build error: evidence-index.json is empty');
            }
          "

      - name: Deploy to Vercel (if VERCEL_TOKEN configured)
        if: github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
